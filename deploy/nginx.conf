# Amara — Nginx config for the EC2 backend instance
# Copy to /etc/nginx/sites-available/amara, symlink into sites-enabled, reload.
#
# The frontend is served separately from S3 + CloudFront — this box only
# runs the Dockerized Fastify backend (see ../back-end/Dockerfile). Nginx
# reverse-proxies port 80 to the container (port 4000) and is the natural
# place to terminate TLS later (certbot) once you have a domain.

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
